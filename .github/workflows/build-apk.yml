name: Build Android APK

on:
  push:
    branches:
      - claude/remote-control-rel8xv
      - main
    paths:
      - 'CC_Ride/mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: CC_Ride/mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: CC_Ride/mobile
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build debug APK
        working-directory: CC_Ride/mobile
        run: flutter build apk --debug --no-shrink

      - name: Build release APK (unsigned)
        working-directory: CC_Ride/mobile
        run: flutter build apk --release --no-shrink

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cc-ride-debug-apk
          path: CC_Ride/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cc-ride-release-apk
          path: CC_Ride/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (on main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: CC Ride Mobile v${{ github.run_number }}
          body: |
            ## CC Ride Mobile App

            Auto-built from commit ${{ github.sha }}

            ### What's included
            - Employee ride booking flow
            - Real-time driver tracking (Socket.IO + OpenStreetMap)
            - Corporate policy enforcement
            - Wallet management
            - Driver dashboard with OTP verification
            - Push notification support

            ### Install
            Download `cc-ride-release-apk` artifact and install via ADB or side-load.
          files: |
            CC_Ride/mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
