<svg width="400" height="360" viewBox="0 0 400 360" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="400" height="360" rx="24" fill="#EBF0FF"/>

  <!-- Dashboard card — main -->
  <rect x="30" y="30" width="340" height="200" rx="20" fill="#0047FF"/>

  <!-- Card inner highlight -->
  <rect x="30" y="30" width="340" height="80" rx="20" fill="#3D75FF" opacity="0.5"/>

  <!-- Card title -->
  <text x="60" y="72" font-family="Arial" font-weight="700" font-size="16" fill="#FFFFFF" opacity="0.9">Monthly Budget</text>
  <text x="60" y="98" font-family="Arial" font-weight="800" font-size="28" fill="#FFFFFF">₦ 500,000</text>

  <!-- Progress bar background -->
  <rect x="60" y="118" width="280" height="12" rx="6" fill="#001A80" opacity="0.4"/>
  <!-- Progress bar fill (62%) -->
  <rect x="60" y="118" width="174" height="12" rx="6" fill="#FFFFFF"/>

  <!-- Progress label -->
  <text x="60"  y="148" font-family="Arial" font-size="12" fill="#AEC3FF">62% used</text>
  <text x="300" y="148" font-family="Arial" font-size="12" fill="#EBF0FF" text-anchor="end">₦190k left</text>

  <!-- Divider -->
  <rect x="60" y="160" width="280" height="1" fill="#FFFFFF" opacity="0.15"/>

  <!-- Stat cells -->
  <!-- Rides -->
  <text x="80"  y="185" font-family="Arial" font-weight="700" font-size="18" fill="#FFFFFF">48</text>
  <text x="80"  y="202" font-family="Arial" font-size="11" fill="#AEC3FF">Rides</text>
  <!-- Divider -->
  <rect x="160" y="172" width="1" height="38" fill="#FFFFFF" opacity="0.2"/>
  <!-- Spend -->
  <text x="180" y="185" font-family="Arial" font-weight="700" font-size="18" fill="#FFFFFF">₦310k</text>
  <text x="180" y="202" font-family="Arial" font-size="11" fill="#AEC3FF">Spent</text>
  <!-- Divider -->
  <rect x="280" y="172" width="1" height="38" fill="#FFFFFF" opacity="0.2"/>
  <!-- Pending -->
  <text x="300" y="185" font-family="Arial" font-weight="700" font-size="18" fill="#FFFFFF">3</text>
  <text x="300" y="202" font-family="Arial" font-size="11" fill="#AEC3FF">Pending</text>

  <!-- Mini team activity strip -->
  <rect x="30" y="248" width="340" height="88" rx="16" fill="#FFFFFF"/>

  <text x="50" y="274" font-family="Arial" font-weight="700" font-size="13" fill="#0047FF">Team Activity</text>

  <!-- Row 1 -->
  <circle cx="60"  y="300" r="14" cy="300" fill="#EBF0FF"/>
  <text x="60" y="304" font-family="Arial" font-size="10" fill="#0047FF" text-anchor="middle">A</text>
  <text x="84"  y="297" font-family="Arial" font-weight="600" font-size="12" fill="#0A1628">Amina Bello</text>
  <text x="84"  y="311" font-family="Arial" font-size="10" fill="#4A6080">Victoria Is. → Lekki</text>
  <rect x="310" y="290" width="48" height="18" rx="6" fill="#EBF0FF"/>
  <text x="334" y="303" font-family="Arial" font-size="10" fill="#0047FF" text-anchor="middle">₦4,200</text>

  <!-- Row 2 -->
  <circle cx="60" cy="328" r="14" fill="#0047FF" opacity="0.12"/>
  <text x="60" y="332" font-family="Arial" font-size="10" fill="#0047FF" text-anchor="middle">K</text>
  <text x="84"  y="325" font-family="Arial" font-weight="600" font-size="12" fill="#0A1628">Kelechi Obi</text>
  <text x="84"  y="339" font-family="Arial" font-size="10" fill="#4A6080">Surulere → Ikeja</text>
  <rect x="310" y="318" width="48" height="18" rx="6" fill="#EBF0FF"/>
  <text x="334" y="331" font-family="Arial" font-size="10" fill="#0047FF" text-anchor="middle">₦3,800</text>

</svg>
