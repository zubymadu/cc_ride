<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background circle -->
  <circle cx="250" cy="250" r="240" fill="#0047FF"/>

  <!-- Car body -->
  <rect x="100" y="255" width="300" height="80" rx="16" fill="#FFFFFF"/>

  <!-- Car roof / cabin -->
  <path d="M155 255 L185 195 Q190 185 200 185 L300 185 Q310 185 315 195 L345 255 Z"
        fill="#FFFFFF"/>

  <!-- Windshield -->
  <path d="M195 255 L218 210 Q222 203 230 203 L270 203 Q278 203 282 210 L305 255 Z"
        fill="#0047FF"/>

  <!-- Left wheel -->
  <circle cx="170" cy="335" r="32" fill="#001A80"/>
  <circle cx="170" cy="335" r="16" fill="#FFFFFF"/>
  <circle cx="170" cy="335" r="6"  fill="#0047FF"/>

  <!-- Right wheel -->
  <circle cx="330" cy="335" r="32" fill="#001A80"/>
  <circle cx="330" cy="335" r="16" fill="#FFFFFF"/>
  <circle cx="330" cy="335" r="6"  fill="#0047FF"/>

  <!-- Headlight left -->
  <rect x="100" y="265" width="28" height="14" rx="7" fill="#EBF0FF"/>

  <!-- Taillight right -->
  <rect x="372" y="265" width="28" height="14" rx="7" fill="#AEC3FF"/>

  <!-- Door line -->
  <line x1="250" y1="255" x2="250" y2="335" stroke="#0047FF" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- "CC RIDE" text label at bottom -->
  <text x="250" y="445"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="800"
        font-size="52"
        letter-spacing="4"
        fill="#FFFFFF"
        text-anchor="middle">CC RIDE</text>

  <!-- Tagline -->
  <text x="250" y="478"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="400"
        font-size="18"
        letter-spacing="2"
        fill="#AEC3FF"
        text-anchor="middle">CORPORATE MOBILITY</text>

</svg>
