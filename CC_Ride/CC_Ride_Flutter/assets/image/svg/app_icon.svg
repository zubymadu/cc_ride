<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="#0047FF"/>

  <!-- Car silhouette (centred, white) -->

  <!-- Body -->
  <rect x="152" y="530" width="720" height="190" rx="38" fill="#FFFFFF"/>

  <!-- Cabin/roof -->
  <path d="M280 530 L340 390 Q355 365 385 365 L639 365 Q669 365 684 390 L744 530 Z"
        fill="#FFFFFF"/>

  <!-- Windshield (blue cutout) -->
  <path d="M340 530 L388 420 Q398 400 418 400 L606 400 Q626 400 636 420 L684 530 Z"
        fill="#0047FF"/>

  <!-- Left wheel -->
  <circle cx="330" cy="720" r="80" fill="#001A80"/>
  <circle cx="330" cy="720" r="40" fill="#FFFFFF"/>
  <circle cx="330" cy="720" r="15" fill="#0047FF"/>

  <!-- Right wheel -->
  <circle cx="694" cy="720" r="80" fill="#001A80"/>
  <circle cx="694" cy="720" r="40" fill="#FFFFFF"/>
  <circle cx="694" cy="720" r="15" fill="#0047FF"/>

  <!-- Headlight -->
  <rect x="152" y="548" width="72" height="36" rx="18" fill="#EBF0FF"/>

  <!-- Taillight -->
  <rect x="800" y="548" width="72" height="36" rx="18" fill="#AEC3FF"/>

  <!-- "CC" text mark above car -->
  <text x="512" y="310"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="180"
        letter-spacing="8"
        fill="#FFFFFF"
        text-anchor="middle"
        opacity="0.95">CC</text>

  <!-- Thin tagline strip at bottom -->
  <rect x="0" y="900" width="1024" height="124" rx="0" fill="#001A80" opacity="0.5"/>
  <text x="512" y="975"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="600"
        font-size="72"
        letter-spacing="6"
        fill="#FFFFFF"
        text-anchor="middle"
        opacity="0.9">RIDE</text>

</svg>
